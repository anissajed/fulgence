services:
  a:
    container_name: task-a
    image: "node:18-alpine"
    working_dir: /usr/src/examples/basic
    environment:
      CHUNK_NAME: a
      PORT: 3000
    volumes:
    - ../..:/usr/src
    - a_node_modules:/usr/src/examples/basic/node_modules
    command: ["npm", "start"]
    networks:
      - fulgence_network
  b:
    container_name: task-b
    image: "node:18-alpine"
    working_dir: /usr/src/examples/basic
    environment:
      CHUNK_NAME: b
      PORT: 3000
    volumes:
    - ../..:/usr/src
    - b_node_modules:/usr/src/examples/basic/node_modules
    command: ["npm", "start"]
    networks:
      - fulgence_network
  c:
    container_name: task-c
    image: "node:18-alpine"
    working_dir: /usr/src/examples/basic
    environment:
      CHUNK_NAME: c
      PORT: 3000
    volumes:
    - ../..:/usr/src
    - c_node_modules:/usr/src/examples/basic/node_modules
    command: ["npm", "start"]
    networks:
      - fulgence_network

volumes:
  a_node_modules:
  b_node_modules:
  c_node_modules:

networks:
  fulgence_network:
